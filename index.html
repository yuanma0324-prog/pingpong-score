<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf3ff 0%,#f7f9fc 42%,#f5f7fa 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:16px;max-width:640px;margin:auto}.app{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(25,118,210,.14);border:1px solid rgba(25,118,210,.08)}h1{text-align:center;font-size:22px;margin:0 0 4px}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}.logo{width:42px;height:42px;border-radius:14px;background:#1976d2;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(25,118,210,.28)}.logo svg{width:30px;height:30px}.subtitle{text-align:center;color:#666;font-size:12px;margin-bottom:14px}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}button{border:0;border-radius:8px;padding:10px 12px;background:#1976d2;color:#fff;font-size:14px;cursor:pointer}.big-icon{font-size:15px}.big-icon::first-letter{font-size:21px}button.gray{background:#eee;color:#222}button.green{background:#00a152}button.pink{background:#ff80ab}button.orange{background:#ff9800}.active{background:#1976d2!important;color:#fff!important}input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px}.label{width:46px;flex:0 0 46px;align-self:center;font-weight:700}.tip{font-size:13px;color:#1976d2;line-height:1.45;margin:8px 0}.note{font-size:12px;color:#666;line-height:1.4;margin:6px 0}.debug{text-align:center;background:#eef6ff;color:#1976d2;border-radius:8px;padding:9px;min-height:38px}.board{display:flex;align-items:center;text-align:center;gap:6px;margin:18px 0}.side{flex:1}.name{font-weight:700;font-size:16px;min-height:22px;word-break:break-word}.score{font-size:52px;font-weight:900;color:#1976d2}.plus{width:68px;height:68px;border-radius:50%;font-size:32px;font-weight:900}.mid{flex:0 0 118px;font-size:14px}.server{color:#e53935;font-weight:800;margin:6px 0}.alert{text-align:center;min-height:26px;color:#e53935;font-size:16px;font-weight:800;line-height:1.4}.box{background:#f9f9f9;border-radius:10px;padding:10px;margin:12px 0}.box h3{text-align:center;font-size:15px;margin:0 0 8px}.item{text-align:center;font-size:13px;padding:3px 0;line-height:1.4}.danger{background:#d32f2f}@media(max-width:430px){body{padding:10px}.app{padding:14px}.score{font-size:44px}.plus{width:58px;height:58px}.mid{flex-basis:92px;font-size:12px}button{font-size:12px;padding:10px 6px}}
</style>
</head>
<body>
<div class="app">
<div class="brand"><div class="logo" aria-label="Ping Pong Logo"><svg viewBox="0 0 100 100" role="img"><circle cx="50" cy="50" r="42" fill="white"/><path d="M50 13v74M13 50h74" stroke="#1976d2" stroke-width="9" stroke-linecap="round"/><circle cx="76" cy="24" r="9" fill="#ff9800"/></svg></div><h1 id="title">Ping Pong Scoreboard v1.0</h1></div><div class="subtitle" id="subtitle">Voice scoring · Match history · CSV export</div>
<div class="row"><button id="langZh" class="active" onclick="setLang('zh')">中文</button><button id="langEn" class="gray" onclick="setLang('en')">English</button></div>
<div class="row"><div class="label" id="labelA">甲：</div><input id="playerA" placeholder="球员甲"></div>
<div class="row"><div class="label" id="labelB">乙：</div><input id="playerB" placeholder="球员乙"></div>
<input id="matchName" placeholder="比赛名称 / Match Name">
<div class="box">
<div class="row"><button id="voiceBtn" class="gray" onclick="toggleVoice()">开启监听</button><div id="listenStatus" style="align-self:center;font-size:13px">状态：未开启</div></div>
<button style="width:100%;background:#7e57c2" onclick="testVoice()">🔊 测试声音 / Test Sound</button>
<div class="tip" id="cmdTip">中文：我赢 / 你赢 / 他赢 / 撤销 / 不算<br>English: mine / me / my point / you / your point / his / he / hey / undo / cancel</div>
<div class="debug" id="voiceDebug">语音：等待输入</div>
<div class="note" id="voiceNote">手机上先点“测试声音”，再点“开启监听”。英文模式会使用英文识别模型。</div>
<div class="row"><button id="mode11" class="active" onclick="setMode(11)">11分制</button><button id="mode21" class="gray" onclick="setMode(21)">21分制</button></div>
</div>
<div class="row"><button id="fmt2" class="active" onclick="setFormat(2)">三局两胜</button><button id="fmt3" class="gray" onclick="setFormat(3)">五局三胜</button><button id="fmt5" class="gray" onclick="setFormat(5)">七局五胜</button></div>
<div class="board">
<div class="side"><div class="name" id="showA">球员甲</div><div class="score" id="scoreA">0</div><button class="plus" onclick="addPoint('A')">+</button></div>
<div class="mid"><b id="vsText">对阵</b><div class="server" id="serverText">发球：球员甲</div><div id="gameScore">局分：0 : 0</div></div>
<div class="side"><div class="name" id="showB">球员乙</div><div class="score" id="scoreB">0</div><button class="plus" onclick="addPoint('B')">+</button></div>
</div>
<div class="alert" id="alertBox"></div>
<div class="box"><h3 id="historyTitle">本场比赛记录</h3><div id="historyList"></div></div>
<div class="box"><h3 id="savedTitle">已保存比赛</h3><div class="row"><button class="danger big-icon" id="clearSavedBtn" onclick="clearSavedMatches()">🗑 清空历史</button></div><div id="savedList"></div><div class="row"><button class="gray" id="prevSavedBtn" onclick="prevSavedPage()">上一页</button><button class="gray" id="nextSavedBtn" onclick="nextSavedPage()">下一页</button></div><div id="savedPageInfo" class="item"></div><div id="savedDetail"></div></div>
<div class="row"><button class="green big-icon" id="nextBtn" onclick="startNextGame()">▶ 开始下一局</button></div>
<div class="row"><button class="big-icon" id="undoBtn" onclick="undo()">↩ 撤销</button><button class="big-icon" id="resetGameBtn" onclick="resetCurrent()">🔄 重置本局</button><button class="danger big-icon" id="resetAllBtn" onclick="resetAll()">⛔ 重置全场</button></div>
<div class="row"><button class="pink big-icon" id="saveBtn" onclick="saveMatch()">💾 保存</button><button class="orange big-icon" id="exportBtn" onclick="exportCSV()">📊 导出CSV</button></div>
</div>
<script>
const T={zh:{title:'乒乓球计分器 v1.0',A:'甲：',B:'乙：',pA:'球员甲',pB:'球员乙',match:'比赛名称',on:'开启监听',off:'关闭监听',stOff:'状态：未开启',stOn:'状态：监听中',wait:'语音：等待输入',heard:'识别：',run:'执行：',unknown:'未识别：',tip:'中文：我赢 / 你赢 / 他赢 / 撤销 / 不算<br>English: mine / me / my point / you / your point / his / he / hey / undo / cancel',note:'手机上先点“测试声音”，再点“开启监听”。英文模式会使用英文识别模型。',m11:'11分制',m21:'21分制',f2:'三局两胜',f3:'五局三胜',f5:'七局五胜',vs:'对阵',serve:'发球：',games:'局分：',hist:'本场比赛记录',saved:'已保存比赛',next:'▶ 开始下一局',undo:'↩ 撤销',resetG:'🔄 重置本局',resetA:'⛔ 重置全场',save:'💾 保存',export:'📊 导出CSV',ready:'声音已开启',sound:'测试声音，1比0',change:'换发球，',serveWord:'发球',game:'第',win:'胜',gameEnd:'本局结束',matchEnd:'比赛结束',nextServe:'下一局发球：',savedMsg:'比赛已保存',noSaved:'暂无保存记录',needSave:'还没有保存的比赛，请先点击保存。',clearHist:'🗑 清空历史',prevPage:'上一页',nextPage:'下一页',subtitle:'语音计分 · 比赛记录 · CSV导出'},en:{title:'Ping Pong Scoreboard v1.0',A:'A:',B:'B:',pA:'Player A',pB:'Player B',match:'Match Name',on:'Start Listening',off:'Stop Listening',stOff:'Status: Off',stOn:'Status: Listening',wait:'Voice: waiting',heard:'Heard: ',run:'Running: ',unknown:'Unknown: ',tip:'Chinese: 我赢 / 你赢 / 他赢 / 撤销 / 不算<br>English: mine / me / my point / you / your point / his / he / hey / undo / cancel',note:'On phone, tap Test Sound first, then Start Listening. English mode uses English recognition.',m11:'11 Points',m21:'21 Points',f2:'Best of 3',f3:'Best of 5',f5:'Best of 7',vs:'VS',serve:'Serve: ',games:'Games: ',hist:'Current Match',saved:'Saved Matches',next:'▶ Start Next Game',undo:'↩ Undo',resetG:'🔄 Reset Game',resetA:'⛔ Reset Match',save:'💾 Save',export:'📊 Export CSV',ready:'Voice is ready',sound:'Sound test, one to zero',change:'Service change. ',serveWord:' serves',game:'Game ',win:'Winner',gameEnd:'Game over',matchEnd:'Match over',nextServe:'Next serve: ',savedMsg:'Match saved',noSaved:'No saved matches',needSave:'No saved matches yet. Please save first.',clearHist:'🗑 Clear History',prevPage:'Previous',nextPage:'Next',subtitle:'Voice scoring · Match history · CSV export'}};
let lang='zh', recognition=null, listening=false, voices=[], pending=null, timer=null, lastCmd='', lastTime=0;
let savedPage=0, savedPageSize=5, expandedSavedIndex=null;
let lastPointTime=0, pointDebounceMs=800;
let game={mode:11,format:2,A:{p:0,g:0},B:{p:0,g:0},start:'A',server:'A',history:[],games:[],locked:false,over:false};
const $=id=>document.getElementById(id);
function tx(){return T[lang]} function name(p){let v=$(p==='A'?'playerA':'playerB').value.trim();return v||(p==='A'?tx().pA:tx().pB)}
function speak(s){if(!('speechSynthesis'in window))return;loadVoices();let u=new SpeechSynthesisUtterance(s),v=pickVoice();if(v)u.voice=v;u.lang=lang==='zh'?'zh-CN':'en-US';u.volume=1;u.rate=.86;u.pitch=1.12;speechSynthesis.speak(u)}
function loadVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()||[]} if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){let target=lang==='zh'?'zh-CN':'en-US';return voices.find(v=>v.lang===target)||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang==='zh'?'zh':'en'))||null}
function unlockVoice(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speak(tx().ready)} function testVoice(){unlockVoice();setTimeout(()=>speak(tx().sound),350)}
function norm(s){return s.toLowerCase().replace(/[，。！？,.!?]/g,'').replace(/’/g,"'").replace(/\s+/g,' ').trim()}
function detect(raw){let c=norm(raw),undo=c.includes('撤销')||c.includes('不算')||c.includes('取消')||['undo','redo','cancel','go back'].includes(c)||c.includes('cancel'),mine=c.includes('我赢')||c.includes('我赢了')||['我','mine','my','me','i','one','won'].includes(c)||c.includes('my point')||c.includes('mine point')||c==='i win'||c==='i won',opp=c.includes('你赢')||c.includes('你赢了')||c.includes('他赢')||c.includes('他赢了')||['你','他','you','u','your','yours','his','he','hey','hes',"he's",'he is','she','her'].includes(c)||c.includes('your point')||c==='you win'||c==='you won';return{type:undo?'undo':mine?'A':opp?'B':'unknown',raw,cmd:c}}
function processVoice(raw){$('voiceDebug').textContent=tx().heard+raw;if(timer)clearTimeout(timer);pending=detect(raw);timer=setTimeout(()=>{execVoice(pending);pending=null},500)}
function execVoice(o){if(!o)return;if(o.type==='unknown'){$('voiceDebug').textContent=tx().unknown+o.raw;return}let now=Date.now(),key=o.type+'|'+o.cmd;if(key===lastCmd&&now-lastTime<1200)return;lastCmd=key;lastTime=now;if(o.type==='undo'){$('voiceDebug').textContent=tx().run+(lang==='zh'?'撤销':'Undo');undo()}else{$('voiceDebug').textContent=tx().run+name(o.type);addPoint(o.type)}}
function initVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert(lang==='zh'?'当前浏览器不支持语音识别，请使用 Safari 或 Chrome。':'Voice recognition is not supported.');return}recognition=new SR();recognition.continuous=true;recognition.interimResults=false;recognition.maxAlternatives=3;setVoiceLang();recognition.onstart=()=>{$('listenStatus').textContent=tx().stOn;$('voiceDebug').textContent=tx().wait};recognition.onresult=e=>{let r=e.results[e.results.length-1];if(!r.isFinal)return;let best='';for(let i=0;i<r.length;i++){if(r[i]&&r[i].transcript){best=r[i].transcript;break}}if(best)processVoice(best)};recognition.onerror=e=>{$('voiceDebug').textContent=(lang==='zh'?'语音错误：':'Voice error: ')+e.error};recognition.onend=()=>{if(listening)setTimeout(()=>{try{recognition.start()}catch(e){}},300)}}
function setVoiceLang(){if(recognition)recognition.lang=lang==='zh'?'zh-CN':'en-US'}
function toggleVoice(){if(!recognition)initVoice();if(!recognition)return;if(!listening){unlockVoice();setVoiceLang();listening=true;try{recognition.start()}catch(e){}$('voiceBtn').textContent=tx().off;$('voiceBtn').classList.remove('gray');$('listenStatus').textContent=tx().stOn}else{listening=false;try{recognition.stop()}catch(e){}$('voiceBtn').textContent=tx().on;$('voiceBtn').classList.add('gray');$('listenStatus').textContent=tx().stOff;$('voiceDebug').textContent=tx().wait}}
function serveInterval(){let a=game.A.p,b=game.B.p;if(a>=game.mode-1&&b>=game.mode-1)return 1;return game.mode===21?5:2}
function calcServer(){let total=game.A.p+game.B.p,sw=Math.floor(total/serveInterval());return sw%2===0?game.start:(game.start==='A'?'B':'A')}
function scoreByServer(){let s=game.server,sp=s==='A'?game.A.p:game.B.p,rp=s==='A'?game.B.p:game.A.p;return lang==='zh'?`${sp}比${rp}`:`${sp} to ${rp}`}
function announceChange(oldS,newS){if(oldS===newS)return;let msg=lang==='zh'?`${tx().change}${name(newS)}${tx().serveWord}`:`${tx().change}${name(newS)}${tx().serveWord}`;$('alertBox').textContent=msg;speak(msg)}
function addPoint(p){
if(game.locked||game.over)return;
let now=Date.now();
if(now-lastPointTime<pointDebounceMs){
$('alertBox').textContent=lang==='zh'?'操作太快，已忽略重复加分':'Too fast. Duplicate point ignored';
return;
}
lastPointTime=now;
let old=game.server;
game.history=[JSON.parse(JSON.stringify(game))];
game[p].p++;
game.server=calcServer();
render();
announceChange(old,game.server);
speak(scoreByServer());
if(isGameWin()){game.locked=true;setTimeout(finishGame,700)}
}
function isGameWin(){return(game.A.p>=game.mode||game.B.p>=game.mode)&&Math.abs(game.A.p-game.B.p)>=2} function isMatchOver(){return game.A.g>=game.format||game.B.g>=game.format}
function finishGame(){if(game.over)return;let a=game.A.p,b=game.B.p,w=a>b?'A':'B';game.games.push({no:game.A.g+game.B.g+1,a,b,w,nameA:name('A'),nameB:name('B')});game[w].g++;renderHistory();render();if(isMatchOver()){game.over=true;let msg=lang==='zh'?`${tx().matchEnd}，${name(w)}获胜！`:`${tx().matchEnd}. ${name(w)} wins!`;$('alertBox').textContent=msg;speak(msg);alert(msg);return}let msg=lang==='zh'?`${tx().gameEnd}，${name(w)}胜，${a}比${b}`:`${tx().gameEnd}. ${name(w)} wins ${a} to ${b}`;$('alertBox').textContent=msg;speak(msg);game.server=game.server==='A'?'B':'A';game.start=game.server;setTimeout(()=>{let m=tx().nextServe+name(game.server);$('alertBox').textContent=m;speak(m);render()},900)}
function undo(){
if(game.locked||game.over)return;
if(!game.history.length){
$('alertBox').textContent=lang==='zh'?'只能撤回一次':'Only one undo allowed';
return;
}
game=game.history.pop();
game.history=[];
lastPointTime=0;
render();
renderHistory();
let score=scoreByServer();
let msg=lang==='zh'?`分数已撤回，现在比分 ${score}`:`Score undone. Current score ${score}`;
$('alertBox').textContent=msg;
speak(msg);
}
function startNextGame(){if(!game.locked||game.over)return;game.A.p=0;game.B.p=0;game.history=[];game.start=game.server;game.locked=false;lastPointTime=0;$('alertBox').textContent='';render()}
function resetCurrent(){game.A.p=0;game.B.p=0;game.server=game.start;game.history=[];game.locked=false;lastPointTime=0;$('alertBox').textContent='';render()} function resetAll(){game={mode:game.mode,format:game.format,A:{p:0,g:0},B:{p:0,g:0},start:'A',server:'A',history:[],games:[],locked:false,over:false};$('alertBox').textContent='';render();renderHistory()}
function setMode(m){game.mode=m;document.querySelectorAll('#mode11,#mode21').forEach(b=>b.classList.add('gray'));$('mode'+m).classList.remove('gray');$('mode'+m).classList.add('active');resetAll();applyText()} function setFormat(f){game.format=f;[2,3,5].forEach(n=>{$('fmt'+n).classList.add('gray');$('fmt'+n).classList.remove('active')});$('fmt'+f).classList.remove('gray');$('fmt'+f).classList.add('active');resetAll();applyText()}
function render(){$('scoreA').textContent=game.A.p;$('scoreB').textContent=game.B.p;$('showA').textContent=name('A');$('showB').textContent=name('B');$('serverText').textContent=tx().serve+name(game.server);$('gameScore').textContent=`${tx().games} ${game.A.g} : ${game.B.g}`}
function renderHistory(){let box=$('historyList');box.innerHTML='';if(!game.games.length){box.innerHTML=`<div class="item">${lang==='zh'?'暂无记录':'No records'}</div>`;return}game.games.forEach(g=>{let d=document.createElement('div');d.className='item';let w=g.w==='A'?g.nameA:g.nameB;d.textContent=lang==='zh'?`${tx().game}${g.no}局：${g.nameA} ${g.a}-${g.b} ${g.nameB}（${tx().win}：${w}）`:`${tx().game}${g.no}: ${g.nameA} ${g.a}-${g.b} ${g.nameB} (${tx().win}: ${w})`;box.appendChild(d)})}
function snapshot(){return{name:$('matchName').value.trim()||new Date().toLocaleString(),time:new Date().toLocaleString(),mode:game.mode,format:game.format,A:name('A'),B:name('B'),gamesA:game.A.g,gamesB:game.B.g,currentA:game.A.p,currentB:game.B.p,history:game.games}}
function saved(){try{return JSON.parse(localStorage.getItem('pp_matches_v14')||'[]')}catch(e){return[]}}
function saveMatch(){let arr=saved();arr.unshift(snapshot());localStorage.setItem('pp_matches_v14',JSON.stringify(arr));renderSaved();alert(tx().savedMsg)}
function renderSaved(){
let box=$('savedList'),detail=$('savedDetail'),info=$('savedPageInfo'),arr=saved();
box.innerHTML='';detail.innerHTML='';
if(!arr.length){box.innerHTML=`<div class="item">${tx().noSaved}</div>`;if(info)info.textContent='';return}
let totalPages=Math.max(1,Math.ceil(arr.length/savedPageSize));
if(savedPage>=totalPages)savedPage=totalPages-1;
if(savedPage<0)savedPage=0;
let start=savedPage*savedPageSize;
let pageItems=arr.slice(start,start+savedPageSize);
pageItems.forEach((m,i)=>{
let realIndex=start+i;
let d=document.createElement('div');
d.className='item';
d.innerHTML=`<div><b>${realIndex+1}. ${m.name}</b></div><div>${m.A} ${m.gamesA}:${m.gamesB} ${m.B}</div><div>${m.time}</div><div style="margin-top:5px"><button class="gray" onclick="toggleSavedDetail(${realIndex})">${expandedSavedIndex===realIndex?(lang==='zh'?'收起':'Hide'):(lang==='zh'?'详情':'Details')}</button><button class="danger" onclick="deleteSavedMatch(${realIndex})">${lang==='zh'?'删除':'Delete'}</button></div>`;
box.appendChild(d);
});
if(info)info.textContent=lang==='zh'?`第 ${savedPage+1} / ${totalPages} 页，共 ${arr.length} 条`:`Page ${savedPage+1} / ${totalPages}, ${arr.length} records`;
if(expandedSavedIndex!==null&&arr[expandedSavedIndex])renderSavedDetail(arr[expandedSavedIndex],expandedSavedIndex);
}
function renderSavedDetail(m,index){
let detail=$('savedDetail');
if(!detail)return;
let rows=[];
rows.push(`<div class="box"><h3>${lang==='zh'?'比赛详情':'Match Detail'} #${index+1}</h3>`);
rows.push(`<div class="item"><b>${m.name}</b></div>`);
rows.push(`<div class="item">${m.A} ${m.gamesA}:${m.gamesB} ${m.B}</div>`);
rows.push(`<div class="item">${m.time}</div>`);
rows.push(`<div class="item">${lang==='zh'?'赛制':'Mode'}: ${m.mode} ${lang==='zh'?'分制':'points'}, ${lang==='zh'?'胜局':'best target'} ${m.format}</div>`);
if(m.history&&m.history.length){
rows.push(`<hr>`);
m.history.forEach(g=>{
let winner=g.w==='A'?m.A:m.B;
rows.push(`<div class="item">${lang==='zh'?'第':'Game '}${g.no}${lang==='zh'?'局':''}: ${m.A} ${g.a}-${g.b} ${m.B} (${lang==='zh'?'胜者':'Winner'}: ${winner})</div>`);
});
}else{
rows.push(`<div class="item">${lang==='zh'?'没有完整局分记录':'No game-by-game history'}</div>`);
}
rows.push(`</div>`);
detail.innerHTML=rows.join('');
}
function toggleSavedDetail(index){
expandedSavedIndex=expandedSavedIndex===index?null:index;
renderSaved();
}
function deleteSavedMatch(index){
let arr=saved();
if(!arr[index])return;
let ok=confirm(lang==='zh'?'确定删除这条比赛记录吗？':'Delete this saved match?');
if(!ok)return;
arr.splice(index,1);
localStorage.setItem('pp_matches_v14',JSON.stringify(arr));
if(expandedSavedIndex===index)expandedSavedIndex=null;
if(expandedSavedIndex!==null&&expandedSavedIndex>index)expandedSavedIndex--;
renderSaved();
}
function clearSavedMatches(){
