<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Pong v1.3 Stable</title>
<style>
body{font-family:sans-serif;padding:20px;max-width:500px;margin:auto}
button{padding:10px;margin:5px;border:none;border-radius:6px;background:#1976D2;color:#fff}
.score{font-size:40px;text-align:center}
</style>
</head>
<body>
<h2>Ping Pong Score</h2>

<input id="a" placeholder="Player A">
<input id="b" placeholder="Player B">

<div class="score" id="score">0 : 0</div>

<button onclick="add('A')">A +1</button>
<button onclick="add('B')">B +1</button>
<button onclick="undo()">Undo</button>
<button onclick="reset()">Reset</button>
<button onclick="save()">Save</button>
<button onclick="exportCSV()">Export</button>

<h3>Saved</h3>
<div id="list"></div>

<script>
let A=0,B=0,history=[];

function update(){
score.innerText=A+" : "+B;
}

function add(p){
history.push([A,B]);
if(p==='A')A++;else B++;
update();
}

function undo(){
if(!history.length)return;
[A,B]=history.pop();
update();
}

function reset(){A=0;B=0;history=[];update();}

function save(){
let data=JSON.parse(localStorage.getItem('pp')||'[]');
data.unshift({A,B,time:new Date().toLocaleString()});
localStorage.setItem('pp',JSON.stringify(data));
render();
}

function render(){
let data=JSON.parse(localStorage.getItem('pp')||'[]');
list.innerHTML='';
data.forEach(d=>{
let div=document.createElement('div');
div.innerText=d.A+":"+d.B+" ("+d.time+")";
list.appendChild(div);
});
}

function exportCSV(){
let data=JSON.parse(localStorage.getItem('pp')||'[]');
let csv="A,B,Time
";
data.forEach(d=>{csv+=d.A+","+d.B+","+d.time+"
"});
let blob=new Blob([csv]);
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='score.csv';
a.click();
}

update();render();
</script>
</body>
</html>
